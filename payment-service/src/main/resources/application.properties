# PayU payment gateway (payment-service).
# Live merchant key/salt must come from server env — do NOT put secrets in git.
# On server ~/ayurvedaa/.env set PAYU_MERCHANT_KEY / PAYU_MERCHANT_SALT then recreate payment-service.

payu.merchant-key=${PAYU_MERCHANT_KEY:}
payu.merchant-salt=${PAYU_MERCHANT_SALT:}
payu.client-id=${PAYU_CLIENT_ID:}
payu.client-secret=${PAYU_CLIENT_SECRET:}
payu.mode=${PAYU_MODE:LIVE}
payu.payment-url=${PAYU_PAYMENT_URL:https://secure.payu.in/_payment}
payu.postservice-url=${PAYU_POSTSERVICE_URL:}
payu.success-url=${PAYU_SUCCESS_URL:http://45.195.229.15:8112/api/v1/payments/payu/success}
payu.failure-url=${PAYU_FAILURE_URL:http://45.195.229.15:8112/api/v1/payments/payu/failure}

ayurveda.payment.pay-page-base-url=${PAY_PAGE_BASE_URL:http://45.195.229.15:8112}
