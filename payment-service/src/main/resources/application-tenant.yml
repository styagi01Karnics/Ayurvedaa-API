spring:
  jpa:
    hibernate:
      ddl-auto: none

ayurveda:
  tenant:
    routing:
      enabled: true
      require-hospital-schema: true
      skip-path-patterns:
        - /api/v1/payments/payu/**
        - /api/v1/payments/public/**
        - /pay/**

auth:
  jwt:
    secret: ${JWT_SECRET:AyurvedaaAuthJwtSecretKeyMustBeAtLeast256BitsLong!!}
