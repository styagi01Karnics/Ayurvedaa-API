# Enables hospital schema routing (JWT schemaName → PostgreSQL search_path).
# Activated by each clinical service Application main via additional profile "tenant".
# Keep secrets out of git: override auth.jwt.secret with env JWT_SECRET in real deploys.

ayurveda:
  tenant:
    routing:
      enabled: true
      require-hospital-schema: true

auth:
  jwt:
    secret: ${JWT_SECRET:AyurvedaaAuthJwtSecretKeyMustBeAtLeast256BitsLong!!}
