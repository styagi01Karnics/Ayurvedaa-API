  payment-service:
    image: sunardock/ayurvedaa-api-payment-service:${IMAGE_TAG}
    container_name: ayurvedaa-api-payment-service
    restart: unless-stopped
    env_file:
      - .env

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
      # Reach billing/notification over Docker DNS (127.0.0.1 inside this container is wrong).
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL:-http://ayurvedaa-api-billing-service:8109}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL:-http://ayurvedaa-api-notification-service:8110}
      # Optional legacy fallback only. Live hospital keys are configured via Super Admin API.
      # For live env-fallback checkout, set PAYU_PAYMENT_URL=https://secure.payu.in/_payment in server .env.
      PAYU_MERCHANT_KEY: ${PAYU_MERCHANT_KEY:-}
      PAYU_MERCHANT_SALT: ${PAYU_MERCHANT_SALT:-}
      PAYU_PAYMENT_URL: ${PAYU_PAYMENT_URL:-https://test.payu.in/_payment}

    ports:
      - "8112:8112"
    networks:
      - ayurvedaa-app-net


networks:

  ayurvedaa-app-net:
    external: true
