spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ayurveda_appointment_db
    username: postgres
    password: postgres@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8082

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG