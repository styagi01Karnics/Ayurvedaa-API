spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://103.174.103.250:5432/ayurveda_db?currentSchema=public
    username: ayurveda
    password: "S@b8at1zeauyrveda"
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO public
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public

server:
  port: 8109

services:
  medicine:
    url: http://103.174.103.250:8108
  appointment:
    url: http://103.174.103.250:8103

billing:
  default-cgst-percent: 3
  default-sgst-percent: 3

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: billing-service

  prometheus:
    metrics:
      export:
        enabled: true
