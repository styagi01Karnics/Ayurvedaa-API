spring:
  application:
    name: billing-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: billing-service
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 1800000
      keepalive-time: 30000
      connection-timeout: 10000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: billing-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: true
    listener:
      missing-topics-fatal: false

server:
  port: 8109

ayurveda:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  tenant:
    routing:
      enabled: true
      require-hospital-schema: true

auth:
  jwt:
    secret: ${JWT_SECRET:AyurvedaaAuthJwtSecretKeyMustBeAtLeast256BitsLong!!}

services:
  medicine:
    url: http://45.195.229.15:8108
  appointment:
    url: http://45.195.229.15:8103
  activity-log:
    url: http://45.195.229.15:8107
    enabled: true

billing:
  default-cgst-percent: 3
  default-sgst-percent: 3

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: billing-service

  prometheus:
    metrics:
      export:
        enabled: true
