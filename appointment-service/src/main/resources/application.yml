spring:
  application:
    name: appointment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: appointment-service
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 1800000
      keepalive-time: 30000
      connection-timeout: 10000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8103

ayurveda:
  tenant:
    routing:
      enabled: true
      require-hospital-schema: true

auth:
  jwt:
    secret: ${JWT_SECRET:AyurvedaaAuthJwtSecretKeyMustBeAtLeast256BitsLong!!}

services:
  patient:
    url: http://45.195.229.15:8101
  doctor:
    url: http://45.195.229.15:8102
  therapist:
    url: http://45.195.229.15:8104
  file-upload:
    url: http://45.195.229.15:8105
  activity-log:
    url: http://45.195.229.15:8107
    enabled: true
  notification:
    url: ${NOTIFICATION_SERVICE_URL:http://45.195.229.15:8110}
    enabled: ${NOTIFICATION_SERVICE_ENABLED:true}

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: appointment-service

  prometheus:
    metrics:
      export:
        enabled: true
