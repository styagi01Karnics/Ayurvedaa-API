spring:
  application:
    name: attendance-service
  datasource:
    url: jdbc:postgresql://45.195.229.15:5432/ayurveda_db?currentSchema=public
    username: ayurveda
    password: "S@b8at1zeauyrveda"
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO public
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public

server:
  port: 8106

# eSSL / ZKTeco ADMS device settings.
# Leave allowed-serial-numbers empty to accept any device SN during setup.
# After go-live, list your K90 Pro serial number(s), e.g.:
#   allowed-serial-numbers:
#     - ABC123456789
adms:
  allowed-serial-numbers: [NFZ8260502757]

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false

logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: attendance-service

  prometheus:
    metrics:
      export:
        enabled: true
