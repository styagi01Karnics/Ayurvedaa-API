spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: auth-service
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
      max-lifetime: 1800000
      keepalive-time: 30000
      connection-timeout: 10000
      leak-detection-threshold: 30000
      connection-init-sql: SET search_path TO public
  jpa:
    hibernate:
      # Never use "create" — it drops public auth tables on every restart.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public

ayurveda:
  security:
    # Production: REQUIRE_HTTPS=true and terminate TLS at nginx/ALB (X-Forwarded-Proto).
    require-https: ${REQUIRE_HTTPS:false}

server:
  port: 8111
  forward-headers-strategy: framework

services:
  activity-log:
    url: http://45.195.229.15:8107
    enabled: true
  notification:
    # Email SMTP is in notification-service only; auth publishes via HTTP.
    url: ${NOTIFICATION_SERVICE_URL:http://127.0.0.1:8110}
    enabled: ${NOTIFICATION_SERVICE_ENABLED:true}

auth:
  jwt:
    secret: ${JWT_SECRET:AyurvedaaAuthJwtSecretKeyMustBeAtLeast256BitsLong!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: auth-service

  prometheus:
    metrics:
      export:
        enabled: true
